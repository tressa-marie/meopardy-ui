<main class="app-screen app-screen--centered home-screen">
  <section class="home-panel" aria-labelledby="home-heading">
    <h1 id="home-heading">{{ gameTitle }}</h1>
    <p class="intro">A very original idea that nobody has ever thought of before.</p>
    <nav class="entry-actions" aria-label="Start playing">
      <a class="entry-button" routerLink="/upload-quiz">Upload Quiz</a>
      <a class="entry-button entry-button--secondary" routerLink="/join">Join Game</a>
    </nav>
    <p class="help-text">Hosting? Bring a quiz JSON file. Playing? Enter the join code from your host.</p>
  </section>
</main>
