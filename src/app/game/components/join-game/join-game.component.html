@if (loading) {
  <p>Loading game...</p>
}

@if (errorMessage) {
  <p class="error">{{ errorMessage }}</p>
}

@if (actionError() || game.error()) {
  <p role="alert">{{ actionError() || game.error() }}</p>
}

@if (joinCode) {
  <main class="app-screen app-screen--centered join-screen">
    <p class="eyebrow">Join the game</p>
    <h1>Meopardy</h1>
    <section class="join-card" aria-label="Join code">
      <p class="label">Join Code</p>
      <p class="code">{{ joinCode }}</p>
    </section>
    <button type="button" class="start-button" [disabled]="starting() || !game.synchronized()" (click)="startGame()">
      {{ starting() ? 'Starting…' : 'Start Game' }}
    </button>
  </main>
}
