<main class="app-screen app-screen--centered lobby-screen">
  <section class="lobby-panel">
    <p class="eyebrow">Admin Lobby</p>
    <h1>Players</h1>
    @if (errorMessage() || game.error()) {
      <p role="alert">{{ errorMessage() || game.error() }}</p>
    }

    @if (players.length === 0) {
      <p class="status">No players have joined yet.</p>
    } @else {
      <ul class="player-list" aria-label="Players in lobby">
        @for (player of players; track player.id) {
          <li class="player-row">
            <span class="player-name">{{ player.name }}</span>
          </li>
        }
      </ul>
    }

    <app-game-settings [gameId]="gameId" [disabled]="starting()" (busyChange)="changingTheme.set($event)" />

    <button type="button" class="start-button" [disabled]="starting() || changingTheme() || !game.synchronized()" (click)="startGame()">
      {{ starting() ? 'Starting…' : 'Start Game' }}
    </button>
  </section>
</main>
